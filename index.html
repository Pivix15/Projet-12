<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <label for="hidden-nom">Nom</label>
    <input type="text" id="hidden-nom" name="nom" />

    <label for="hidden-email">Email</label>
    <input type="email" id="hidden-email" name="email" />

    <label for="hidden-sujet">Sujet</label>
    <input type="text" id="hidden-sujet" name="sujet" />

    <label for="hidden-message">Message</label>
    <textarea id="hidden-message" name="message"></textarea>

    <label for="hidden-bot">Ne pas remplir</label>
    <input type="text" id="hidden-bot" name="bot-field" />
  </form>
</body>

</html>
